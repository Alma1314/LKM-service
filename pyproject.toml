[project]
name = "backend"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "pydantic[email]>=2.13.4",
    "fastapi[standard]>=0.139.2",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic-settings>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
python_functions = ["test_*", "should_*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "alembic>=1.13.0",
]
