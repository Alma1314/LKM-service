[project]
name = "backend"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "pydantic[email]>=2.13.4",
    "fastapi[standard]>=0.139.2",
    "sqlalchemy>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.0",
    "httpx>=0.28.0",
    "cbor2>=5.6.0",
    "strawberry-graphql>=0.263.0",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9",
    "webauthn>=2,<3",
    "argon2-cffi>=23.1.0",
    "redis>=5.0.0",
    "aio-pika>=9.4.0",
    "apscheduler>=3.10.4",
    "sentry-sdk>=2.0",
    "boto3>=1.35.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
python_functions = ["test_*", "should_*"]
asyncio_mode = "auto"
markers = [
    "integration: 需真实 Redis 的集成测试，默认排除，用 `uv run pytest -m integration` 显式运行",
]
addopts = ["-m", "not integration"]
filterwarnings = [
    "error",
    "ignore::ResourceWarning",
]

[tool.basedpyright]
include = ["app"]
typeCheckingMode = "standard"
reportOverlappingOverload = false
reportUnknownArgumentType = true
reportUnknownParameterType = true
reportUnknownVariableType = true
reportUnknownMemberType = true
reportUnknownLambdaType = true
reportMissingParameterType = true
reportMissingTypeStubs = false
reportUnannotatedClassAttribute = true
reportUnusedCallResult = false
reportUnusedImport = true
reportUnusedVariable = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "alembic>=1.13.0",
    "basedpyright>=1.39.9",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16",
    "ty>=0.0.70",
    "fakeredis>=2.22.0",
    "locust>=2.46.3",
    "moto>=5.0.0",
    "import-linter>=2.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["alembic", "blog_repos"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF", "SIM", "ASYNC", "PERF", "ANN"]
ignore = [
    "RUF001",  # 中文全角标点/破折号非 bug，保留中文风格
    "RUF002",
    "RUF003",
    "ANN401",  # 后端在 ORM/stub 边界刻意用 Any
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Security",
    "fastapi.Query", "fastapi.Path", "fastapi.Header",
    "fastapi.Cookie", "fastapi.Body", "fastapi.Form", "fastapi.File",
    "app.modules.auth.deps.RequireLevel",
    "app.modules.rbac.deps.RequirePermission",
    "app.core.common.PaginateDep",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]  # 测试函数不强制返回类型标注
"main.py" = ["F401"]       # from app.main import app 是 uvicorn 入口

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.13"

# 架构边界门禁。
# 允许依赖：modules/* → core/*（基础）、modules/A → modules/B（仅 B.__init__ 公共 API）、
# api/main → modules（聚合层）。禁止：core/*→modules/*、db/*→modules/*。
# 下发是"指令式理想边界"，对架构固有的注册/消费路径用 ignore_imports 精确豁免
# （注册枢纽、worker 消费业务、调度的降级分支、共享 repo 辅助等），其余强制。
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "边界: core 不依赖业务模块"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules"]
# allow_indirect_imports=true：只检查**直接** core→modules import（杜绝新增业务直连），
# 放行经桥接模块（db.model_registry/session 等在各自契约已豁免）的既有间接路径。
allow_indirect_imports = "true"
# 既定的跨切/注册耦合（见 P4-T3 审计），逐一精确允许，防止任意 core→modules：
ignore_imports = [
    "app.core.jobs -> app.modules.auth.channels",   # 发送降级同步分支
    "app.core.jobs -> app.modules.auth.deps",       # 发送降级同步分支
    "app.core.task_registry -> app.modules.auth.tasks",  # 任务注册枢纽
    "app.core.task_registry -> app.modules.blog.tasks",  # 任务注册枢纽
    "app.core.task_registry -> app.modules.files.tasks",  # 任务注册枢纽
    "app.core.task_registry -> app.modules.points.tasks",  # 任务注册枢纽
    "app.core.throttle -> app.modules.auth.errors",  # 限流复用账户锁定语义
    "app.core.worker_dlq -> app.modules.admin.models",  # worker 消费业务模型(DlqMessage)
]

[[tool.importlinter.contracts]]
name = "边界: db 层不反向依赖业务模块"
type = "forbidden"
source_modules = ["app.db"]
forbidden_modules = ["app.modules"]
# 模型注册枢纽 + 共享 repo/seed 辅助（见 P4-T3 审计）：
ignore_imports = [
    "app.db.init_db -> app.modules.rbac.seed",  # schema 就绪后种 RBAC 默认权限
    "app.db.model_registry -> app.modules.admin.models",  # 模型预注册枢纽
    "app.db.model_registry -> app.modules.articles.models",
    "app.db.model_registry -> app.modules.auth.models",
    "app.db.model_registry -> app.modules.blog.models",
    "app.db.model_registry -> app.modules.content.models",
    "app.db.model_registry -> app.modules.exam.models",
    "app.db.model_registry -> app.modules.files.models",
    "app.db.model_registry -> app.modules.feed.models",
    "app.db.model_registry -> app.modules.points.models",
    "app.db.model_registry -> app.modules.projects.models",
    "app.db.model_registry -> app.modules.starhope.models",
    "app.db.repo -> app.modules.auth.models",  # 共享批量 Profile 查询
    "app.db.repo -> app.modules.auth.schemas",  # ProfileInfo DTO
    "app.db.session -> app.modules.auth.errors",  # 会话构造错误码
]

[[tool.importlinter.contracts]]
# 三段：跨业务模块任意依赖收紧为可断言门禁。
# rbac/storage/health 是共享基础设施/零依赖岛，不列入业务域；业务模块可自由 import 它们。
# forbidden 只拦 12 个"业务模块域"互相 import；同域内（含 __init__ 再导出）不受拦。
# 合法的跨域（治理聚合 admin、事件入队 points.rules、模型关系预注册、读聚合等）逐一入 ignore_imports 白名单并记理由。
# 归零到 "3 kept, 0 broken" 为验收；任何新增业务域间直连 import 会被此契约拦下。
name = "边界: 业务模块间不任意依赖(须走公共API/白名单)"
type = "forbidden"
source_modules = ["app.modules.admin","app.modules.articles","app.modules.auth","app.modules.blog","app.modules.content","app.modules.exam","app.modules.feed","app.modules.files","app.modules.points","app.modules.projects","app.modules.starhope"]
forbidden_modules = ["app.modules.admin","app.modules.articles","app.modules.auth","app.modules.blog","app.modules.content","app.modules.exam","app.modules.feed","app.modules.files","app.modules.points","app.modules.projects","app.modules.starhope"]
# 只检查**直接**业务模块→业务模块 import；放行经 db/model_registry、core/task_registry 的间接装配路径（各自契约已豁免）。
allow_indirect_imports = "true"
# 合法跨域(read/装配/注册/降级/治理聚合)，由 Task1 现状审计全量导出（94 条，逐条对应实测 broken 边）——
# 归零冻结现状拓扑：任何新增未在其内业务模块间直连，会被上方契约拦下。
# M2.2/M2.3(content 子域收中、follow+timeline→feed)已结构性消掉最大扇入，本清单随源模块移动 re-anchor 相应条目。
ignore_imports = [
    # content 子域 router 复用 admin 2FA step-up(deps 二次鉴权)与 auth 鉴权 deps/当前用户、seed 注册 ORM：
    "app.modules.content.boards.router -> app.modules.admin.deps",
    "app.modules.content.boards.router -> app.modules.auth.deps",
    "app.modules.content.columns.router -> app.modules.admin.deps",
    "app.modules.content.columns.router -> app.modules.auth.deps",
    "app.modules.content.qa.router -> app.modules.auth.deps",
    # files/projects router 写/管理端点同样复用 admin.deps 的 admin+2FA 校验：
    "app.modules.files.router -> app.modules.admin.deps",
    "app.modules.projects.router -> app.modules.admin.deps",
    # content/models → feed/models 为 ORM relationship 的 TYPE_CHECKING 前向引用（防导入环，运行时不加载）：
    "app.modules.content.models -> app.modules.feed.models",
    "app.modules.content.models -> app.modules.auth.models",
    # auth/models 对 blog/content/exam/files/feed models 的 TYPE_CHECKING 关系前向引用（同上，防 ORM relationship 环）：
    "app.modules.auth.models -> app.modules.blog.models",
    "app.modules.auth.models -> app.modules.content.models",
    "app.modules.auth.models -> app.modules.exam.models",
    "app.modules.auth.models -> app.modules.files.models",
    "app.modules.auth.models -> app.modules.feed.models",
    # 各业务域 models → auth.models：跨域 FK/relationship 指向 User/Profile（ORM 关系声明）：
    "app.modules.articles.models -> app.modules.auth.models",
    "app.modules.blog.models -> app.modules.auth.models",
    "app.modules.exam.models -> app.modules.auth.models",
    "app.modules.files.models -> app.modules.auth.models",
    "app.modules.feed.models -> app.modules.auth.models",
    "app.modules.projects.models -> app.modules.auth.models",
    # routers/schemas/graphql → auth：认证/账户地基依赖（CurrentUser/ProfileInfo DTO/User 展示）：
    "app.modules.articles.router -> app.modules.auth.deps",
    "app.modules.articles.schemas -> app.modules.auth.schemas",
    "app.modules.articles.seed -> app.modules.auth.models",
    "app.modules.articles.service -> app.modules.auth.schemas",
    "app.modules.blog.git_http -> app.modules.auth.models",
    "app.modules.blog.git_http -> app.modules.auth.security",
    "app.modules.blog.graphql -> app.modules.auth.schemas",
    "app.modules.blog.router -> app.modules.auth.deps",
    "app.modules.blog.schemas -> app.modules.auth.schemas",
    "app.modules.blog.service -> app.modules.auth.models",
    "app.modules.blog.service -> app.modules.auth.schemas",
    "app.modules.content.boards.seed -> app.modules.auth.models",
    "app.modules.content.columns.seed -> app.modules.auth.models",
    "app.modules.content.router -> app.modules.auth.deps",
    "app.modules.content.service -> app.modules.auth.models",
    "app.modules.exam.router -> app.modules.auth.deps",
    "app.modules.exam.seed -> app.modules.auth.models",
    "app.modules.exam.service -> app.modules.auth.models",
    "app.modules.files.router -> app.modules.auth.deps",
    "app.modules.files.seed -> app.modules.auth.models",
    "app.modules.files.service -> app.modules.auth.deps",
    "app.modules.files.service -> app.modules.auth.models",
    "app.modules.feed.router -> app.modules.auth.deps",
    "app.modules.feed.service -> app.modules.auth.models",
    "app.modules.points.router -> app.modules.auth.deps",
    "app.modules.points.seed -> app.modules.auth.models",
    "app.modules.points.service -> app.modules.auth.models",
    "app.modules.projects.router -> app.modules.auth.deps",
    "app.modules.projects.service -> app.modules.auth.models",
    "app.modules.starhope.router -> app.modules.auth.deps",
    "app.modules.feed.feed -> app.modules.auth.models",
    # service 发布经 points 事件规则入队/记账（qa reward/spend、通用 enqueue_points_event 积分钩子）：
    "app.modules.articles.service -> app.modules.points.rules",
    "app.modules.content.service -> app.modules.points.rules",
    # qa escrow reward/spend 记账：M2.2 收中后随 qa 逻辑入 content/service：
    "app.modules.content.service -> app.modules.points.service",
    "app.modules.exam.service -> app.modules.points.rules",
    "app.modules.files.service -> app.modules.points.rules",
    # board 板块发帖需读 exam 证书等级档位（解锁门槛判定）——M2.2 收中后随 boards 逻辑入 content/service：
    "app.modules.content.service -> app.modules.exam.models",
    # blog → content：blog 发布联写入 content_items 聚合（publish_blog_item）+ 读 block 元：
    "app.modules.blog.router -> app.modules.content.schemas",
    "app.modules.blog.router -> app.modules.content.service",
    "app.modules.blog.service -> app.modules.content.models",
    "app.modules.blog.service -> app.modules.content.service",
    # admin 后台治理聚合面：跨域读 articles/blog/content/auth/files 供管理/内容/举报/用户 dashboard（合法治理，非业务直连）：
    "app.modules.admin.content_router -> app.modules.articles.service",
    "app.modules.admin.content_router -> app.modules.blog.service",
    "app.modules.admin.content_router -> app.modules.content.schemas",
    "app.modules.admin.content_router -> app.modules.content.service",
    "app.modules.admin.content_router -> app.modules.auth.deps",
    "app.modules.admin.content_router -> app.modules.auth.service_auth",
    "app.modules.admin.auth_router -> app.modules.auth.deps",
    "app.modules.admin.auth_router -> app.modules.auth.errors",
    "app.modules.admin.auth_router -> app.modules.auth.service_2fa",
    "app.modules.admin.auth_router -> app.modules.auth.service_auth",
    "app.modules.admin.auth_router -> app.modules.auth.service_verify",
    "app.modules.admin.auth_router -> app.modules.auth.models",
    "app.modules.admin.reports_router -> app.modules.auth.deps",
    "app.modules.admin.users_router -> app.modules.auth.deps",
    "app.modules.admin.users_router -> app.modules.auth.models",
    "app.modules.admin.users_router -> app.modules.content.models",
    "app.modules.admin.users_router -> app.modules.files.models",
    "app.modules.admin.moderation.admin_router -> app.modules.auth.deps",
    "app.modules.admin.permissions -> app.modules.auth.deps",
    "app.modules.admin.schemas -> app.modules.auth.schemas",
    "app.modules.admin.seed -> app.modules.auth.models",
    # admin deps/models → auth：会话/User 复用与 require_admin 常量适配：
    "app.modules.admin.deps -> app.modules.auth.deps",
    "app.modules.admin.deps -> app.modules.auth.models",
    "app.modules.admin.models -> app.modules.auth.models",
    # feed 信息流读聚合 sink：6 源(articles/content/auth/projects)+关注(feed.service 同域)+审核(admin.moderation.engine)；M2.3 follow+timeline 并入单一 feed 域：
    "app.modules.feed.feed -> app.modules.articles.models",
    "app.modules.feed.feed -> app.modules.content.models",  # 时间线 read 源读 content_items/discussion/blog_post 归一
    "app.modules.feed.feed -> app.modules.projects.models",
    "app.modules.feed.service -> app.modules.admin.moderation.engine",
    "app.modules.feed.service -> app.modules.content.models",  # 关注写校验目标版块存在(Board)读 content
    "app.modules.admin.auth_router -> app.modules.auth.security",
    # feed/models → content/models：BoardFollow ↔ Board 的 TYPE_CHECKING 关系前向引用（防导入环，运行时不加载）：
    "app.modules.feed.models -> app.modules.content.models",
]

