# AUTH 独立库 Alembic 配置（M3.B S1）。与主库的 alembic.ini（monolith 共享库）并列，
# 只管理 auth 自持库的迁移链（script_location = alembic_auth/）。
# 驱动：`alembic -c alembic.auth.ini upgrade head`
#       / env.py 内按 settings.auth_database_url（async 方言会同步化）。
# env.py 仍以 settings 里 auth 库 URL 为准；此 sqlalchemy.url 仅占位、会被 env 覆盖。

[alembic]
# 相对本 ini（%(here)s）的 auth 迁移脚本目录
script_location = %(here)s/alembic_auth

# URL：实际由 env.py 用 settings.auth_database_url 覆盖（async→sync 方言）。
sqlalchemy.url = driver://user:pass@localhost/dbname

# 供 alembic 查找项目模块的 sys.path
prepend_sys_path = .
path_separator = os


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
