openapi: "3.1.0"
info:
  title: LKM Service API
  version: "0.0.1"
  description: 理科迷社区后端服务接口文档

servers:
  - url: http://localhost:8000/api/v1
    description: 本地开发

tags:
  - name: health
    description: 健康检查
  - name: members
    description: 成员名单查询
  - name: auth
    description: 注册、登录、Token、用户资料
  - name: auth-2fa
    description: TOTP 两步验证
  - name: auth-oauth
    description: GitHub OAuth 登录与绑定
  - name: auth-passkey
    description: WebAuthn 通行密钥
  - name: auth-settings
    description: 邮箱/手机号绑定
  - name: auth-recovery
    description: 账号恢复
  - name: boards
    description: 分科板块
  - name: columns
    description: 专栏申请、审核、发文
  - name: forum
    description: 社区论坛帖子与评论
  - name: blog
    description: 博客系列、文件内容、收藏、评论
  - name: blog-git
    description: Git HTTP 后端（博客仓库读写）

paths:
  /health:
    $ref: "paths/health.yaml#/health"
  /members:
    $ref: "paths/members.yaml#/list"

  /auth/me:
    $ref: "paths/auth.yaml#/me"
  /auth/{user_id}:
    $ref: "paths/auth.yaml#/profile"
  /auth/{user_id}/profile:
    $ref: "paths/auth.yaml#/editProfile"
  /auth/reg/local:
    $ref: "paths/auth.yaml#/regLocal"
  /auth/reg/normal:
    $ref: "paths/auth.yaml#/regNormal"
  /auth/reg/normal/verify:
    $ref: "paths/auth.yaml#/regNormalVerify"
  /auth/reg/phone:
    $ref: "paths/auth.yaml#/regPhone"
  /auth/reg/phone/verify:
    $ref: "paths/auth.yaml#/regPhoneVerify"
  /auth/reg/email:
    $ref: "paths/auth.yaml#/regEmail"
  /auth/reg/email/verify:
    $ref: "paths/auth.yaml#/regEmailVerify"
  /auth/login/password:
    $ref: "paths/auth.yaml#/loginPassword"
  /auth/login/code/request:
    $ref: "paths/auth.yaml#/loginCodeRequest"
  /auth/login/code:
    $ref: "paths/auth.yaml#/loginCode"
  /auth/login/magic-link/request:
    $ref: "paths/auth.yaml#/magicLinkRequest"
  /auth/login/magic-link/verify:
    $ref: "paths/auth.yaml#/magicLinkVerify"
  /auth/refresh:
    $ref: "paths/auth.yaml#/refresh"
  /auth/logout:
    $ref: "paths/auth.yaml#/logout"

  /auth/2fa/setup/begin:
    $ref: "paths/auth-2fa.yaml#/setupBegin"
  /auth/2fa/setup/temp:
    $ref: "paths/auth-2fa.yaml#/setupTemp"
  /auth/2fa/setup/complete:
    $ref: "paths/auth-2fa.yaml#/setupComplete"
  /auth/2fa/setup/complete/temp:
    $ref: "paths/auth-2fa.yaml#/setupCompleteTemp"
  /auth/2fa/setup/confirm:
    $ref: "paths/auth-2fa.yaml#/setupConfirm"
  /auth/2fa/verify:
    $ref: "paths/auth-2fa.yaml#/verify"
  /auth/2fa:
    $ref: "paths/auth-2fa.yaml#/disable"

  /auth/oauth/github/login:
    $ref: "paths/auth-oauth.yaml#/githubLogin"
  /auth/oauth/github/callback:
    $ref: "paths/auth-oauth.yaml#/githubCallback"
  /auth/oauth/github/login/redirect:
    $ref: "paths/auth-oauth.yaml#/githubLoginRedirect"
  /auth/oauth/github/bind-callback:
    $ref: "paths/auth-oauth.yaml#/githubBindCallback"

  /auth/passkey/register/begin:
    $ref: "paths/auth-passkey.yaml#/registerBegin"
  /auth/passkey/register/complete:
    $ref: "paths/auth-passkey.yaml#/registerComplete"
  /auth/passkey/login/begin:
    $ref: "paths/auth-passkey.yaml#/loginBegin"
  /auth/passkey/login/complete:
    $ref: "paths/auth-passkey.yaml#/loginComplete"
  /auth/passkey/credentials:
    $ref: "paths/auth-passkey.yaml#/credentials"
  /auth/passkey/{cred_id}:
    $ref: "paths/auth-passkey.yaml#/deleteCredential"

  /auth/settings/bind-email/request:
    $ref: "paths/auth-settings.yaml#/bindEmailRequest"
  /auth/settings/bind-email/verify:
    $ref: "paths/auth-settings.yaml#/bindEmailVerify"
  /auth/settings/bind-phone/request:
    $ref: "paths/auth-settings.yaml#/bindPhoneRequest"
  /auth/settings/bind-phone/verify:
    $ref: "paths/auth-settings.yaml#/bindPhoneVerify"

  /auth/recover/check:
    $ref: "paths/auth-recovery.yaml#/check"
  /auth/recover/phone:
    $ref: "paths/auth-recovery.yaml#/phone"
  /auth/recover/phone/verify:
    $ref: "paths/auth-recovery.yaml#/phoneVerify"
  /auth/recover/email:
    $ref: "paths/auth-recovery.yaml#/email"
  /auth/recover/email/verify:
    $ref: "paths/auth-recovery.yaml#/emailVerify"
  /auth/recover/magic-link:
    $ref: "paths/auth-recovery.yaml#/magicLink"
  /auth/recover/magic-link/verify:
    $ref: "paths/auth-recovery.yaml#/magicLinkVerify"
  /auth/recover/verify-totp:
    $ref: "paths/auth-recovery.yaml#/verifyTotp"
  /auth/recover/complete:
    $ref: "paths/auth-recovery.yaml#/complete"
  /auth/recover/admin/begin:
    $ref: "paths/auth-recovery.yaml#/adminBegin"
  /auth/recover/admin/verify-contact:
    $ref: "paths/auth-recovery.yaml#/adminVerifyContact"
  /auth/recover/admin/verify-totp:
    $ref: "paths/auth-recovery.yaml#/adminVerifyTotp"
  /auth/recover/admin/complete:
    $ref: "paths/auth-recovery.yaml#/adminComplete"

  /boards/status:
    $ref: "paths/boards.yaml#/status"

  /columns/status:
    $ref: "paths/columns.yaml#/status"
  /columns/plan:
    $ref: "paths/columns.yaml#/plan"
  /columns/applications:
    $ref: "paths/columns.yaml#/applications"
  /columns/applications/{application_id}:
    $ref: "paths/columns.yaml#/applicationDetail"
  /columns/applications/{application_id}/review:
    $ref: "paths/columns.yaml#/review"
  /columns:
    $ref: "paths/columns.yaml#/columns"
  /columns/{column_id}:
    $ref: "paths/columns.yaml#/columnDetail"
  /columns/{column_id}/posts:
    $ref: "paths/columns.yaml#/posts"
  /columns/{column_id}/posts/{post_id}:
    $ref: "paths/columns.yaml#/postDetail"

  /forum/status:
    $ref: "paths/forum.yaml#/status"
  /forum/posts:
    $ref: "paths/forum.yaml#/posts"
  /forum/posts/{post_id}:
    $ref: "paths/forum.yaml#/postDetail"
  /forum/posts/{post_id}/like:
    $ref: "paths/forum.yaml#/likePost"
  /forum/posts/{post_id}/comments:
    $ref: "paths/forum.yaml#/comments"

  /blog/series:
    $ref: "paths/blog.yaml#/series"
  /blog/series/{series_id}:
    $ref: "paths/blog.yaml#/seriesDetail"
  /blog/series/{series_id}/files/{filepath}:
    $ref: "paths/blog.yaml#/fileContent"
  /blog/series/{series_id}/star:
    $ref: "paths/blog.yaml#/star"
  /blog/series/{series_id}/comments:
    $ref: "paths/blog.yaml#/comments"
  /blog/series/{series_id}/comments/{comment_id}:
    $ref: "paths/blog.yaml#/deleteComment"

  /blog/git/{repo_name}.git/{rest}:
    $ref: "paths/blog-git.yaml#/gitHttp"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token，由登录/注册接口返回
  schemas:
    ApiResp:
      type: object
      properties:
        code: { type: integer, example: 0 }
        msg:  { type: string, example: "OK" }
        data: {}
    ListData:
      type: object
      properties:
        items: { type: array, items: {} }
    PageData:
      type: object
      properties:
        items: { type: array, items: {} }
        total: { type: integer }
        page:  { type: integer }
        pages: { type: integer }
    ModuleStatus:
      type: object
      properties:
        module:         { type: string }
        status:         { type: string }
        responsibility: { type: string }
        next_steps:     { type: array, items: { type: string } }
    AuthTokenData:
      type: object
      properties:
        access_token:  { type: string }
        refresh_token: { type: string }
        token_type:    { type: string, example: "bearer" }
        user:
          type: object
          properties:
            id:            { type: integer }
            username:      { type: string }
            account_level: { type: string }
            role:          { type: string }
    ProfileInfo:
      type: object
      properties:
        nickname: { type: string, nullable: true }
        avatar:   { type: string, nullable: true }
        role:     { type: string }
