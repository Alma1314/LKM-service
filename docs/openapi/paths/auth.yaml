reg:
  post:
    tags: [auth]
    summary: 用户注册
    operationId: register
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [username, email, password]
            properties:
              username:
                type: string
                minLength: 1
                maxLength: 100
              email:
                type: string
                format: email
              password:
                type: string
                minLength: 6
    responses:
      "200":
        description: 注册成功
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: integer, example: 0 }
                msg: { type: string, example: "OK" }
                data:
                  type: object
                  properties:
                    user_id: { type: integer }
      "400":
        description: 用户名或邮箱已注册
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: integer, example: 1002 }
                msg: { type: string }

login:
  post:
    tags: [auth]
    summary: 用户登录
    operationId: login
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [username, password]
            properties:
              username:
                type: string
                minLength: 1
              password:
                type: string
    responses:
      "200":
        description: 登录成功，返回用户 ID（调用方需保存并在后续请求中通过 X-User-Id Header 传递）
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: integer, example: 0 }
                msg: { type: string, example: "OK" }
                data:
                  type: object
                  properties:
                    user_id: { type: integer }
      "401":
        description: 用户不存在或密码错误
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: integer, example: 1004 }

profile:
  get:
    tags: [auth]
    summary: 获取用户资料
    operationId: getProfile
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: integer }
    responses:
      "200":
        description: 用户资料
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: integer, example: 0 }
                msg: { type: string, example: "OK" }
                data:
                  type: object
                  properties:
                    nickname: { type: string, nullable: true }
                    avatar: { type: string, nullable: true }
                    role: { type: string, enum: [member, admin] }
      "401":
        description: 用户不存在

editProfile:
  put:
    tags: [auth]
    summary: 修改个人资料（只能改自己的）
    operationId: updateProfile
    security:
      - UserIdHeader: []
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: integer }
      - name: X-User-Id
        in: header
        required: true
        schema: { type: integer }
        description: 必须与路径中的 user_id 一致
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              nickname: { type: string, nullable: true }
              avatar: { type: string, nullable: true }
    responses:
      "200":
        description: 更新成功
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: integer, example: 0 }
                msg: { type: string, example: "OK" }
                data:
                  type: object
                  properties:
                    nickname: { type: string, nullable: true }
                    avatar: { type: string, nullable: true }
                    role: { type: string, enum: [member, admin] }
      "403":
        description: X-User-Id 与路径 user_id 不匹配
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: integer, example: 1005 }
                msg: { type: string }
