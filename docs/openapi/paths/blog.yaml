series:
  post:
    tags: [blog]
    summary: 创建博客系列
    operationId: createBlogSeries
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title]
            properties:
              title:       { type: string }
              description: { type: string }
              cover_url:   { type: string }
    responses:
      "200":
        description: 创建成功
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"
  get:
    tags: [blog]
    summary: 博客系列列表
    operationId: listBlogSeries
    responses:
      "200":
        description: 系列列表
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"

seriesDetail:
  get:
    tags: [blog]
    summary: 博客系列详情
    operationId: getBlogSeries
    parameters:
      - name: series_id
        in: path
        required: true
        schema: { type: integer }
    responses:
      "200":
        description: 系列详情（含文章列表和星标状态）
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"
  put:
    tags: [blog]
    summary: 更新博客系列
    operationId: updateBlogSeries
    security:
      - BearerAuth: []
    parameters:
      - name: series_id
        in: path
        required: true
        schema: { type: integer }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title:       { type: string }
              description: { type: string }
              cover_url:   { type: string }
    responses:
      "200":
        description: 更新成功
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"
  delete:
    tags: [blog]
    summary: 删除博客系列
    operationId: deleteBlogSeries
    security:
      - BearerAuth: []
    parameters:
      - name: series_id
        in: path
        required: true
        schema: { type: integer }
    responses:
      "200":
        description: 删除成功
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"

fileContent:
  get:
    tags: [blog]
    summary: 获取 Git 仓库文件内容
    description: 通过 Git 读取博客系列关联仓库中的文件。
    operationId: getBlogFileContent
    parameters:
      - name: series_id
        in: path
        required: true
        schema: { type: integer }
      - name: filepath
        in: path
        required: true
        schema: { type: string }
        description: 仓库内文件路径
    responses:
      "200":
        description: 文件内容
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"

star:
  post:
    tags: [blog]
    summary: 切换博客系列星标
    description: 已标星则取消，未标星则添加。
    operationId: toggleBlogStar
    security:
      - BearerAuth: []
    parameters:
      - name: series_id
        in: path
        required: true
        schema: { type: integer }
    responses:
      "200":
        description: 当前星标状态
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"

comments:
  post:
    tags: [blog]
    summary: 创建评论
    operationId: createBlogComment
    security:
      - BearerAuth: []
    parameters:
      - name: series_id
        in: path
        required: true
        schema: { type: integer }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [content]
            properties:
              content: { type: string }
    responses:
      "200":
        description: 评论已创建
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"
  get:
    tags: [blog]
    summary: 博客系列评论列表
    operationId: listBlogComments
    parameters:
      - name: series_id
        in: path
        required: true
        schema: { type: integer }
    responses:
      "200":
        description: 评论列表
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"

deleteComment:
  delete:
    tags: [blog]
    summary: 删除评论
    operationId: deleteBlogComment
    security:
      - BearerAuth: []
    parameters:
      - name: series_id
        in: path
        required: true
        schema: { type: integer }
      - name: comment_id
        in: path
        required: true
        schema: { type: integer }
    responses:
      "200":
        description: 删除成功
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"
