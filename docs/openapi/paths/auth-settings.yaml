bindEmailRequest:
  post:
    tags: [auth-settings]
    summary: 请求绑定邮箱验证码
    operationId: bindEmailRequest
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string, format: email }
    responses:
      "200":
        description: 验证码已发送
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"

bindEmailVerify:
  post:
    tags: [auth-settings]
    summary: 验证并绑定邮箱
    description: 验证邮箱验证码，绑定到当前用户，本地用户自动升级为普通用户。
    operationId: bindEmailVerify
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, code]
            properties:
              email: { type: string, format: email }
              code:  { type: string, minLength: 6, maxLength: 6 }
    responses:
      "200":
        description: 绑定成功
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"

