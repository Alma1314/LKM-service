setupBegin:
  post:
    tags: [auth-2fa]
    summary: 开始 TOTP 设置
    description: 返回密钥和二维码 URI。需要 normal 及以上账号等级。
    operationId: setup2faBegin
    security:
      - BearerAuth: []
    responses:
      "200":
        description: TOTP 密钥和 QR 码 URI
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"

setupTemp:
  post:
    tags: [auth-2fa]
    summary: 开始强制 TOTP 设置
    description: 使用管理员登录时获得的临时令牌开始设置。
    operationId: setup2faTemp
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [temp_token]
            properties:
              temp_token: { type: string }
    responses:
      "200":
        description: TOTP 密钥和 QR 码 URI
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"

setupComplete:
  post:
    tags: [auth-2fa]
    summary: 完成 TOTP 设置
    description: 验证 TOTP 码后返回恢复码。
    operationId: setup2faComplete
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: { type: string }
    responses:
      "200":
        description: 设置完成，返回恢复码
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"

setupCompleteTemp:
  post:
    tags: [auth-2fa]
    summary: 完成强制 TOTP 设置
    description: 使用临时令牌完成 TOTP 设置并返回 token。
    operationId: setup2faCompleteTemp
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [temp_token, code]
            properties:
              temp_token: { type: string }
              code:       { type: string }
    responses:
      "200":
        description: 设置完成，返回 token 和恢复码
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"

setupConfirm:
  post:
    tags: [auth-2fa]
    summary: 确认已保存恢复码
    operationId: setup2faConfirm
    security:
      - BearerAuth: []
    responses:
      "200":
        description: 确认成功
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"

verify:
  post:
    tags: [auth-2fa]
    summary: 登录时验证 2FA
    description: 使用登录后获取的临时令牌和 TOTP/恢复码完成 2FA 验证。
    operationId: verify2fa
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [temp_token]
            properties:
              temp_token:    { type: string }
              code:          { type: string, description: TOTP 码 }
              recovery_code: { type: string, description: 恢复码（与 TOTP 二选一） }
              trust_device:  { type: boolean }
    responses:
      "200":
        description: 验证成功，返回 JWT token 对
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"

disable:
  delete:
    tags: [auth-2fa]
    summary: 禁用 TOTP
    description: 需要有效的 TOTP 码。
    operationId: disable2fa
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: { type: string }
    responses:
      "200":
        description: 禁用成功
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"
