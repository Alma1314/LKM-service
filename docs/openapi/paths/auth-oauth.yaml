githubLogin:
  get:
    tags: [auth-oauth]
    summary: GitHub OAuth 登录
    description: 重定向到 GitHub 授权页面。
    operationId: githubLogin
    responses:
      "302":
        description: 重定向到 GitHub

githubCallback:
  get:
    tags: [auth-oauth]
    summary: GitHub OAuth 登录回调
    operationId: githubCallback
    parameters:
      - name: code
        in: query
        required: true
        schema: { type: string }
      - name: state
        in: query
        required: true
        schema: { type: string }
    responses:
      "200":
        description: 登录成功，返回 JWT token 对
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"

githubLoginRedirect:
  post:
    tags: [auth-oauth]
    summary: 获取 GitHub 绑定授权 URL
    description: 已登录用户获取用于绑定 GitHub 的授权 URL。
    operationId: githubLoginRedirect
    security:
      - BearerAuth: []
    responses:
      "200":
        description: 授权 URL
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"

githubBindCallback:
  get:
    tags: [auth-oauth]
    summary: GitHub 绑定回调
    description: 处理 GitHub OAuth 绑定回调。
    operationId: githubBindCallback
    security:
      - BearerAuth: []
    parameters:
      - name: code
        in: query
        required: true
        schema: { type: string }
      - name: state
        in: query
        required: true
        schema: { type: string }
    responses:
      "200":
        description: 绑定成功
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiResp"
