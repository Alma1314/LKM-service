status:
  get:
    tags: [columns]
    summary: 专栏模块状态
    operationId: columnsStatus
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                module: { type: string, example: "columns" }
                status: { type: string, example: "implemented_minimal" }
                responsibility: { type: string }
                next_steps:
                  type: array
                  items: { type: string }

plan:
  get:
    tags: [columns]
    summary: 专栏数据库表结构规划
    operationId: columnsPlan
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: integer, example: 0 }
                msg: { type: string, example: "OK" }
                data:
                  type: object
                  properties:
                    status: { type: string }
                    tables:
                      type: object
                    next_steps:
                      type: array
                      items: { type: string }

applications:
  get:
    tags: [columns]
    summary: 专栏申请列表
    operationId: listApplications
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: integer, example: 0 }
                msg: { type: string, example: "OK" }
                data:
                  type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: "#/components/schemas/ColumnApplication"
  post:
    tags: [columns]
    summary: 提交专栏申请
    operationId: createApplication
    security:
      - UserIdHeader: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [user_id, title, description, reason]
            properties:
              user_id: { type: integer }
              title: { type: string, maxLength: 80 }
              description: { type: string, maxLength: 300 }
              reason: { type: string, maxLength: 500 }
    responses:
      "200":
        description: 申请已提交
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: integer, example: 0 }
                msg: { type: string, example: "OK" }
                data:
                  $ref: "#/components/schemas/ColumnApplication"

applicationDetail:
  get:
    tags: [columns]
    summary: 专栏申请详情
    operationId: getApplication
    parameters:
      - name: application_id
        in: path
        required: true
        schema: { type: integer }
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: integer, example: 0 }
                msg: { type: string, example: "OK" }
                data:
                  $ref: "#/components/schemas/ColumnApplication"
      "404":
        description: 申请不存在 (2001)

review:
  post:
    tags: [columns]
    summary: 审核专栏申请
    operationId: reviewApplication
    security:
      - UserIdHeader: []
    parameters:
      - name: application_id
        in: path
        required: true
        schema: { type: integer }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reviewer_id, status]
            properties:
              reviewer_id: { type: integer }
              status: { type: string, enum: [approved, rejected] }
              review_note: { type: string, maxLength: 300, nullable: true }
    responses:
      "200":
        description: 审核完成；若 approved 则自动创建对应专栏
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: integer, example: 0 }
                msg: { type: string, example: "OK" }
                data:
                  type: object
                  properties:
                    application:
                      $ref: "#/components/schemas/ColumnApplication"
                    column:
                      oneOf:
                        - $ref: "#/components/schemas/Column"
                        - type: "null"

columns:
  get:
    tags: [columns]
    summary: 专栏列表
    operationId: listColumns
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: integer, example: 0 }
                msg: { type: string, example: "OK" }
                data:
                  type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: "#/components/schemas/Column"

columnDetail:
  get:
    tags: [columns]
    summary: 专栏详情
    operationId: getColumn
    parameters:
      - name: column_id
        in: path
        required: true
        schema: { type: integer }
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: integer, example: 0 }
                msg: { type: string, example: "OK" }
                data:
                  $ref: "#/components/schemas/Column"
      "404":
        description: 专栏不存在 (2002)

posts:
  get:
    tags: [columns]
    summary: 专栏文章列表
    operationId: listPosts
    parameters:
      - name: column_id
        in: path
        required: true
        schema: { type: integer }
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: integer, example: 0 }
                msg: { type: string, example: "OK" }
                data:
                  type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: "#/components/schemas/ColumnPost"
  post:
    tags: [columns]
    summary: 发布专栏文章
    operationId: createPost
    security:
      - UserIdHeader: []
    parameters:
      - name: column_id
        in: path
        required: true
        schema: { type: integer }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [author_id, title, content]
            properties:
              author_id: { type: integer }
              title: { type: string, maxLength: 120 }
              summary: { type: string, maxLength: 300, nullable: true }
              content: { type: string, minLength: 1 }
    responses:
      "200":
        description: 发布成功
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: integer, example: 0 }
                msg: { type: string, example: "OK" }
                data:
                  $ref: "#/components/schemas/ColumnPost"

postDetail:
  get:
    tags: [columns]
    summary: 专栏文章详情
    operationId: getPost
    parameters:
      - name: column_id
        in: path
        required: true
        schema: { type: integer }
      - name: post_id
        in: path
        required: true
        schema: { type: integer }
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: integer, example: 0 }
                msg: { type: string, example: "OK" }
                data:
                  $ref: "#/components/schemas/ColumnPost"
      "404":
        description: 文章不存在 (2003)

components:
  schemas:
    ColumnApplication:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        title: { type: string }
        description: { type: string }
        reason: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        reviewer_id: { type: integer, nullable: true }
        review_note: { type: string, nullable: true }
        created_at: { type: string }
        reviewed_at: { type: string, nullable: true }

    Column:
      type: object
      properties:
        id: { type: integer }
        owner_id: { type: integer }
        application_id: { type: integer, nullable: true }
        title: { type: string }
        description: { type: string }
        cover_url: { type: string, nullable: true }
        status: { type: string, enum: [active, archived] }
        created_at: { type: string }
        updated_at: { type: string }

    ColumnPost:
      type: object
      properties:
        id: { type: integer }
        column_id: { type: integer }
        author_id: { type: integer }
        title: { type: string }
        summary: { type: string, nullable: true }
        status: { type: string, enum: [draft, published, archived] }
        created_at: { type: string }
        updated_at: { type: string }
        published_at: { type: string, nullable: true }
